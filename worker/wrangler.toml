name               = "snehal-leadgen-api"
main               = "src/index.js"
compatibility_date = "2025-04-01"
workers_dev        = true

[observability.logs]
enabled         = true
invocation_logs = true

# Runs every day at 04:30 UTC = 10:00 AM IST.
# Scans all active products across the whole Pune MIDC belt and queues
# outreach drafts for approval — see scheduled() in src/index.js.
[triggers]
crons = ["30 4 * * *"]

# Workers AI binding — Llama 3.1 for relevance scoring + email drafting
[ai]
binding = "AI"

[[d1_databases]]
binding       = "DB"
database_name = "snehal-leadgen"
database_id   = "754cde78-7955-4f6f-8e4f-1fa2a859a0ef"

# Cloudflare Secrets Store — same pattern as the main Stellar workers repo.
# Create the secrets once in the dashboard (Workers & Pages > Secrets Store),
# or via `wrangler secrets-store secret create`, then reference them here.
# Replace REPLACE_WITH_YOUR_SECRETS_STORE_ID with your store's ID.

[[secrets_store_secrets]]
binding     = "TAVILY_API_KEY"
secret_name = "TAVILY_API_KEY"
store_id    = "61701f5a905946c29837feed5c149410"

[[secrets_store_secrets]]
binding     = "SENDER_EMAIL"
secret_name = "SENDER_EMAIL"
store_id    = "61701f5a905946c29837feed5c149410"

# Plain (non-secret) config — link included in the "please approve" email.
[vars]
DASHBOARD_URL = "https://snehalprinters-workflows.pages.dev"
